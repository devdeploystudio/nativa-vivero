guiaCuidados:
  id: "guia-cuidados"
  kicker: "Guía rápida"
  titulo: "Cuidados básicos para que tu planta dure"
  imagen: "/galeria/01-invernadero-estantes.jpg"
  items:
    - icono: "sol"
      pregunta: "¿Cuánta luz necesita mi planta?"
      respuesta: "La mayoría de las plantas de interior prefieren luz indirecta intensa: cerca de una ventana, pero sin sol directo del mediodía que puede quemar las hojas. Las suculentas y cactus sí toleran sol pleno varias horas al día."
    - icono: "gota"
      pregunta: "¿Cada cuánto riego?"
      respuesta: "Depende de la especie, la estación y el tamaño de la maceta: no hay una regla fija. Lo más seguro es tocar los primeros 3-4 cm de sustrato. Si está seco, es momento de regar; si sigue húmedo, esperá unos días más."
    - icono: "maceta"
      pregunta: "¿Cuándo trasplanto?"
      respuesta: "Cuando las raíces asoman por los agujeros de drenaje o la maceta se seca muy rápido después de regar. Lo ideal es hacerlo en primavera, con una maceta apenas más grande (2 a 4 cm más de diámetro) y sustrato nuevo."
    - icono: "hoja"
      pregunta: "Las hojas se ponen amarillas, ¿qué hago?"
      respuesta: "Casi siempre es exceso de riego. Dejá secar bien el sustrato antes de volver a regar y revisá que la maceta tenga buen drenaje. Si es solo una hoja vieja de abajo, puede ser normal."
    - icono: "pata"
      pregunta: "¿Qué plantas son seguras si tengo mascotas?"
      respuesta: "Pilea, Calathea y Helecho Boston son buenas opciones pet-friendly. Evitá dejar Monstera, Pothos, Espatifilo o Ficus al alcance de gatos y perros que mastican hojas: son tóxicas si se ingieren."
    - icono: "estrella"
      pregunta: "¿Cuáles son las más fáciles para arrancar?"
      respuesta: "Zamioculcas, Sansevieria y Pothos perdonan casi cualquier error: aguantan poca luz, riego salteado y son las que más recomendamos para quien recién empieza."
